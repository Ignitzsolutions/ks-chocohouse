upstream bakery_ecom_upstream {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=admin_login_limit:10m rate=10r/m;
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

server {
    listen 80;
    listen [::]:80;
    server_name kschocohouse.com www.kschocohouse.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.kschocohouse.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kschocohouse.com;

    ssl_certificate /etc/letsencrypt/live/www.kschocohouse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kschocohouse.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://www.kschocohouse.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kschocohouse.com;

    ssl_certificate /etc/letsencrypt/live/www.kschocohouse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kschocohouse.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location __PUBLIC_UPLOADS_BASE_URL__/ {
        alias /var/lib/bakery_ecom/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /api/admin/auth/login {
        limit_req zone=admin_login_limit burst=10 nodelay;
        proxy_pass http://bakery_ecom_upstream;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://bakery_ecom_upstream;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
