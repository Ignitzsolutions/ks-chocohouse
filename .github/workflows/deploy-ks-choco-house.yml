name: Deploy KS Choco House to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: ks-choco-house
  AZURE_RESOURCE_GROUP: projecte_group
  AZURE_CLIENT_ID: b9ff4385-d20e-41e3-a188-533d81eccf97
  AZURE_TENANT_ID: 71d5cfc6-c4a6-4ae1-9e25-c8b74ab9d923
  AZURE_SUBSCRIPTION_ID: e63a31c1-d798-485d-b9ab-c0251ab9f380
  NODE_VERSION: "20"
  SITE_URL: https://ks-choco-house.azurewebsites.net
  NEXT_PUBLIC_SITE_URL: https://ks-choco-house.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Prepare standalone package
        run: |
          rm -rf .output
          mkdir -p .output
          cp -R .next/standalone/. .output/
          mkdir -p .output/.next
          cp -R .next/static .output/.next/static
          cp -R public .output/public

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .output
